<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodHub - Food Delivery</title>
    <meta name="description" content="Order delicious food from the best restaurants" />
    
    <!-- ✅ Prevent console errors from showing in production -->
    <script>
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        // Disable console in production
        window.console = {
          log: function() {},
          info: function() {},
          warn: function() {},
          error: function() {},
          debug: function() {},
          table: function() {},
          group: function() {},
          groupEnd: function() {},
          time: function() {},
          timeEnd: function() {},
          count: function() {},
          trace: function() {},
          assert: function() {},
          dir: function() {},
          dirxml: function() {},
          groupCollapsed: function() {},
          memory: function() {},
          profile: function() {},
          profileEnd: function() {},
          timeStamp: function() {},
          clear: function() {}
        };
        
        // Prevent errors from showing
        window.addEventListener('error', function(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }, true);
        
        window.addEventListener('unhandledrejection', function(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }, true);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
